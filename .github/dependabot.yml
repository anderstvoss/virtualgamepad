version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Hash-locked pre-commit install used by the CI policy job.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      pre-commit-toolchain:
        patterns: ["*"]

  # gitsubmodule is deliberately absent: the protocol-research gitlink only
  # moves through the reviewed research workflow, which regenerates the
  # checked-in fixtures (see the protocol-research job in ci.yml).
