name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, offset from gitleaks-history.yml so they don't queue
    # together.
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # GitHub-native code scanning is free on public repos and gated on
    # Advanced Security on private; gate accordingly like the rest of
    # the remote-CI surface.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # The Rust extractor only supports build-mode none; the cargo
          # build below still runs so dependencies resolve the same way.
          - language: rust
            build-mode: none
          # Scans the workflow files themselves (script injection,
          # untrusted checkout, excessive permissions). No build needed.
          - language: actions
            build-mode: none

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # CodeQL pulls bundle + database from a wider set of GitHub
          # CDN endpoints than the standard rust-toolchain flow, so
          # this allowlist is slightly broader than ci.yml's.
          # Audit, not block: block mode intermittently drops GitHub IPs on
          # checkout and runner status reporting, stalling jobs as in_progress.
          # The allowlist stays as the documented expected egress.
          egress-policy: audit
          allowed-endpoints: >
            archive.ubuntu.com:443
            security.ubuntu.com:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux audio build dependencies
        if: matrix.language == 'rust'
        run: sudo bash scripts/install-ci-audio-deps.sh

      - name: Install Rust
        if: matrix.language == 'rust'
        # The SHA-pinned dtolnay/rust-toolchain at this revision
        # requires an explicit toolchain input. `stable` here is a
        # baseline; rust-toolchain.toml at the repo root drives the
        # actual cargo invocations via rustup.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Cache cargo
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: codeql-${{ matrix.language }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@bc0b696b4103f5fe60f15749af68a046868d511a # codeql-bundle-v2.25.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds higher-severity, lower-noise queries
          # on top of the default suite.
          queries: security-extended

      - name: Build (manual)
        if: matrix.language == 'rust'
        # Rust needs an explicit build for CodeQL to observe the
        # compilation. cargo build (debug) is enough; the dev profile
        # keeps the run fast.
        run: cargo build --locked --all-targets --all-features

      # Analysis results are uploaded together by the `upload` job
      # below, not here. Code scanning posts its "CodeQL" PR check on
      # the first upload for a commit; the actions analysis finishes
      # minutes before Rust, so uploading per job left that check
      # "neutral" ("1 configuration not found: /language:rust") until
      # Rust caught up, and for good on runs cancelled in between.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@bc0b696b4103f5fe60f15749af68a046868d511a # codeql-bundle-v2.25.4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: sarif-results

      - name: Keep SARIF for upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/${{ matrix.language }}.sarif
          if-no-files-found: error
          retention-days: 1

  upload:
    name: CodeQL upload
    needs: analyze
    # Upload only when every language analysed, so the PR comparison
    # always sees both configurations at once. A failed analysis is
    # already red on its own CodeQL (<language>) job.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          # The analyze job's GitHub endpoints, in case upload-sarif
          # fetches the CodeQL bundle to process the SARIF.
          # Audit, not block: block mode intermittently drops GitHub IPs on
          # checkout and runner status reporting, stalling jobs as in_progress.
          # The allowlist stays as the documented expected egress.
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            release-assets.githubusercontent.com:443

      # upload-sarif reads the checkout to fill in any missing alert
      # fingerprints.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codeql-sarif-*
          path: ${{ runner.temp }}/sarif
          merge-multiple: true

      # Same categories as before, so PRs keep comparing against the
      # existing configurations on main.
      - name: Upload Rust results
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a # codeql-bundle-v2.25.4
        with:
          sarif_file: ${{ runner.temp }}/sarif/rust.sarif
          category: "/language:rust"

      - name: Upload actions results
        uses: github/codeql-action/upload-sarif@bc0b696b4103f5fe60f15749af68a046868d511a # codeql-bundle-v2.25.4
        with:
          sarif_file: ${{ runner.temp }}/sarif/actions.sarif
          category: "/language:actions"
