name: Provider Tier B

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  contract-surface:
    name: Contract surface
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            archive.ubuntu.com:443
            security.ubuntu.com:443
            api.github.com:443
            github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            static.rust-lang.org:443
            static.crates.io:443
            index.crates.io:443
            crates.io:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux audio build dependencies
        run: sudo bash scripts/install-ci-audio-deps.sh

      - name: Validate maintained protocol surfaces
        run: |
          python3 scripts/check-workspace-commands.py
          cargo test --locked -p gr-hid -p gr-curated-controllers -p gr-usbip --lib
          cargo build --locked -p gr-audio-worker
          python3 scripts/validate-production-audio-worker.py --worker target/debug/gr-audio-worker
          cargo build --locked -p gr-usbip --example usb_audio_probe
          python3 scripts/validate-usb-audio-worker.py --worker target/debug/examples/usb_audio_probe

      - name: Record live acceptance boundary
        run: echo 'Protocol checks do not establish privileged provider acceptance; prepared-runner job remains disabled.'

  privileged-linux:
    name: Privileged Linux provider validation
    # Enable this once a self-hosted Linux runner with /dev/uinput
    # access exists. Until then keep the job explicit but inert so the
    # intended validation shape is visible in-repo.
    if: false
    runs-on: [self-hosted, linux, uinput]
    timeout-minutes: 20
    needs: contract-surface

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify uinput device access
        run: test -e /dev/uinput

      - name: Run owned provider lifecycle tests
        run: |
          cargo test --locked -p gr-provider-linux-uinput integration_tests::creates_and_destroys_a_process_owned_device -- --ignored --exact
          cargo test --locked -p gr-provider-linux-uhid integration_tests::creates_and_destroys_a_process_owned_hid_device -- --ignored --exact
