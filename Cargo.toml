[package]
name = "virtualgamepad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Workspace root package and provider feature host for virtualgamepad."
publish = false

[workspace]
members = [
    "crates/gr-hid",
    "crates/gr-realization-api",
    "crates/gr-dualsense-wire",
    "crates/gr-controller-wire",
    "crates/gr-audio-contract",
    "crates/gr-audio-linux",
    "crates/gr-usbip",
    "crates/gr-audio-worker",
    "crates/gr-controller-contract",
    "crates/gr-controller-runtime",
    "crates/gr-curated-controllers",
    "crates/gr-provider-linux-uinput",
    "crates/gr-provider-linux-uhid",
    "crates/gr-privileged-broker",
    "crates/gr-provider-linux-dummy-hcd",
    "demo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/anderstvoss/virtualgamepad"
authors = ["Anders Voss <anderstvoss@gmail.com>"]

[workspace.dependencies]
libc = "0.2"
proptest = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
gr-hid = { path = "crates/gr-hid", version = "0.1" }
gr-controller-contract = { path = "crates/gr-controller-contract", version = "0.1" }
gr-controller-runtime = { path = "crates/gr-controller-runtime", version = "0.1" }
gr-realization-api = { path = "crates/gr-realization-api", version = "0.1" }
gr-audio-contract = { path = "crates/gr-audio-contract", version = "0.1" }
gr-curated-controllers = { path = "crates/gr-curated-controllers", version = "0.1" }

[lints]
workspace = true

[features]
default = []
# Research/SPI only: excluded from the application API stability promise.
experimental = []
audio-pipewire = ["dep:gr-audio-linux", "gr-audio-linux/pipewire"]
audio-usbip = ["dep:gr-audio-worker", "dep:gr-privileged-broker", "dep:gr-usbip"]

[dev-dependencies]
gr-curated-controllers = { path = "crates/gr-curated-controllers", version = "0.1", features = ["test-support"] }

[[example]]
name = "usb_audio_root"
required-features = ["audio-usbip"]

[[example]]
name = "usb_audio_acceptance"
required-features = ["audio-usbip"]

[[example]]
name = "usb_audio_native_probe"
required-features = ["audio-usbip", "audio-pipewire"]

[target.'cfg(target_os = "linux")'.dependencies]
gr-audio-linux = { path = "crates/gr-audio-linux", version = "0.1", optional = true }
gr-audio-worker = { path = "crates/gr-audio-worker", version = "0.1", optional = true }
gr-privileged-broker = { path = "crates/gr-privileged-broker", version = "0.1", optional = true }
gr-usbip = { path = "crates/gr-usbip", version = "0.1", optional = true }
