[package]
name = "virtualgamepad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Workspace root package and provider feature host for virtualgamepad."
publish = false

[workspace]
members = [
    "crates/gr-realization-api",
    "crates/gr-controller-contract",
    "crates/gr-controller-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/anderstvoss/virtualgamepad"
authors = ["Anders Voss <anderstvoss@gmail.com>"]

[workspace.dependencies]
assert_matches = "1.5"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
insta = "1"
proptest = "1"
trybuild = "1"
rstest = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smallvec = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[dependencies]
gr-controller-contract = { path = "crates/gr-controller-contract", version = "0.1" }
gr-controller-runtime = { path = "crates/gr-controller-runtime", version = "0.1" }
gr-realization-api = { path = "crates/gr-realization-api", version = "0.1" }

[lints]
workspace = true
