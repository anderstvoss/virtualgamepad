"linux.dummy_hcd.usb-hid" = { status = "not-supported", test_id = "acceptance/dualsense/adaptive-triggers", evidence = [], reason = "f_hid lacks full GET_REPORT metadata and explicit negative replies; creation rejects before host resources." }
