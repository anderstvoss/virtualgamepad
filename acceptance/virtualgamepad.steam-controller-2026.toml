[[functions]]
id = "steam-client"
[functions.cells]
"linux.uinput" = { status = "wip", test_id = "acceptance/steam-controller-2026/steam-client", evidence = [], reason = "Owner observed not listed in Stable Steam 1792618285 after isolated reduced-uinput creation, with controller support enabled. Input test unavailable; no per-control Steam evidence. The ordinary event node was readable. A fresh-demo repeat was also not listed; previous and final owned nodes disappeared, and final normal removal/shutdown had no owner-reported errors. See docs/C6_D9_ACCEPTANCE.md. No HID feature channel exists for this realization." }
"linux.uhid.usb" = { status = "wip", test_id = "acceptance/steam-controller-2026/steam-client", evidence = [], reason = "Owner observed not listed in Stable Steam 1792618285 after creating merged C6 wired UHID, with controller support enabled. Input test unavailable; no per-control Steam evidence. A diagnostic-only repeat was also not listed; original close and repeated-creation removal completed without errors and owned nodes disappeared. Feature 1 commands ae/83/85/8e/87 and setting IDs 50/9 were logged; request origin/completion and the cause of non-listing are unproven. See docs/C6_D9_ACCEPTANCE.md. Step 16 stub negative remains separate. Opt-in recorded attribute/settings profile retest: controller-info log succeeds with zero failures, but still not listed, including after post-open neutral. No controls/Identify acceptance; owned nodes removed. Subsequent DC/E2-acknowledgement trial listed as Steam Controller and Begin Test opened, with default synthetic serial and unchanged non-attribute GET framing. Controls remain unresolved: held B closed tester and an isolated A tap was reported as B then A; physical reference capture requested. KDE Steam remote-control permission timing is unestablished, so DC/E2 causality is not proven. Fresh full-profile instance listed and opened tester with change-driven reports. Under owner-selected Gyro desktop profile, face buttons, D-pad, shoulders/stick clicks, trigger 0..32767..0, stick directions and pad +/-20000 positions / 1000..16000 pressure worked. Rear GUI labels/grip presentation remain qualified; Steam press navigated to main UI. Gyro view stayed zero despite verified nonzero raw vectors, so motion remains unresolved. Current instance final cleanup pending. Final close had zero write failures and owned nodes disappeared." }

[[functions]]
id = "kernel-evdev-decoding"
[functions.cells]
"linux.uinput" = { status = "wip", test_id = "acceptance/steam-controller-2026/kernel-evdev-decoding", evidence = [], reason = "Observed D9 C6 follow-up: 22 buttons, both pad clicks, sticks, positive triggers and contact-gated pad axes decode; touch metadata/motion absent as documented. Negative triggers clamp to zero. Lab seat/group/0660/open and owned-node cleanup pass. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }
"linux.uhid.usb" = { status = "wip", test_id = "acceptance/steam-controller-2026/kernel-evdev-decoding", evidence = [], reason = "Observed D9 C6 follow-up: initial kernel mode emits no events; 650 ms Menu press/release enables gamepad mode. Then all 22 buttons, pad clicks/coordinates, sticks/triggers and all six sensor axes/timestamps decode. Negative raw triggers may fall below advertised minimum. Lab seat/group/0660/open and cleanup pass. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }

