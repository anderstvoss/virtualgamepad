[[functions]]
id = "steam-client"
[functions.cells]
"linux.uinput" = { status = "wip", test_id = "acceptance/steam-controller-2026/steam-client", evidence = [], reason = "Owner observed not listed in Stable Steam 1792618285 after isolated reduced-uinput creation, with controller support enabled. Input test unavailable; no per-control Steam evidence. The ordinary event node was readable. A fresh-demo repeat was also not listed; previous and final owned nodes disappeared, and final normal removal/shutdown had no owner-reported errors. See docs/C6_D9_ACCEPTANCE.md. No HID feature channel exists for this realization." }
"linux.uhid.usb" = { status = "source-evidence", test_id = "steam_controller_2026::codec::tests::steam_client_retry_sequence_completes_each_poll_and_closes_independent_sessions_once", evidence = ["steam-d9-named-setting-framing", "steam-d9-wired-entry-stability-consumer"], reason = "D9 Stable Steam 1792618285: two clean physical entries were stable; two baseline virtual entries replaced on opening Controller list, with same-node raw reopen/native-node return, stable AE/83 replies and rejected named ED reads. Exact named reads with synthetic absent record replies gave two stable candidate lists, no observed raw reopen or controller-info failure, and Begin Test opened in both. One details transition remained visually unclear. Earlier manual controls, valid-pose gyro, Ping/SDL rumble, Deny/Allow portal comparison and cleanup are in C6_D9_ACCEPTANCE.md. This isolates a bounded workaround, not evdev UI identity, populated physical pairing data, universal stability, individual attribute requirements, persistent denial before creation or gameplay acceptance." }

[[functions]]
id = "kernel-evdev-decoding"
[functions.cells]
"linux.uinput" = { status = "wip", test_id = "acceptance/steam-controller-2026/kernel-evdev-decoding", evidence = [], reason = "Observed D9 C6 follow-up: 22 buttons, both pad clicks, sticks, positive triggers and contact-gated pad axes decode; touch metadata/motion absent as documented. Historical probe negatives clamped to zero; public validation now rejects negatives. Lab seat/group/0660/open and owned-node cleanup pass. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }
"linux.uhid.usb" = { status = "wip", test_id = "acceptance/steam-controller-2026/kernel-evdev-decoding", evidence = [], reason = "Observed D9 C6 follow-up: initial kernel mode emits no events; 650 ms Menu press/release enables gamepad mode. Then all 22 buttons, pad clicks/coordinates, sticks/triggers and all six sensor axes/timestamps decode. The historical raw negative-trigger disagreement is now prevented by public validation. Lab seat/group/0660/open and cleanup pass. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }

[[functions]]
id = "evdev-abs-ioctl"
[functions.cells]
"linux.uinput" = { status = "wip", test_id = "acceptance/steam-controller-2026/evdev-abs-ioctl", evidence = [], reason = "Observed D9 C6 follow-up: all ten gamepad axes match golden min/max/flat. Fuzz/resolution are zero: provider-limited disagreement with golden pad fuzz 256 and stick/pad/trigger resolutions 6553/1638/5461. No sensor companion. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }
"linux.uhid.usb" = { status = "wip", test_id = "acceptance/steam-controller-2026/evdev-abs-ioctl", evidence = [], reason = "Observed D9 C6 follow-up: all ten gamepad and six sensor axes match every golden min/max/fuzz/flat/resolution attribute. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }

