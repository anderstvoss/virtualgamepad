[[functions]]
id = "haptics"
[functions.cells]
"linux.uinput" = { status = "source-evidence", test_id = "steam_controller_2026::evdev::tests::reduced_gamepad_matches_pinned_ibex_capabilities", evidence = ["steam-c6-kernel-ibex-gamepad-evdev"], reason = "Source/synthetic retained haptics tested; uinput has conventional FF_RUMBLE only. SDL submitted rumble, but controller delivery and physical actuator effects: No evidence." }
"linux.uhid.usb" = { status = "physical-evidence", test_id = "steam_controller_2026::codec::tests::fake_hid_runtime_completes_each_haptic_request_and_closes_once", evidence = ["steam-c6-output-80-81", "steam-d9-sdl-rumble-channels", "steam-d9-steam-ping-script", "steam-d9-midi-lfo-framing"], reason = "Physical #105/#106 records corroborate normal SDL rumble, Steam Ping and padded MIDI LFO requests, with owner qualitative feedback; virtual reverse requests matched. Other 0x81/82/84 semantics remain source-backed, not physically qualified here; no calibrated actuator placement, frequency or loudness claim." }

