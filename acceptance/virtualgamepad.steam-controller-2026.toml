"linux.uhid.usb" = { status = "wip", test_id = "acceptance/steam-controller-2026/evdev-abs-ioctl", evidence = [], reason = "Observed D9 C6 follow-up: all ten gamepad and six sensor axes match every golden min/max/fuzz/flat/resolution attribute. See docs/C6_D9_ACCEPTANCE.md; no formal research run record adopted." }

