"linux.dummy_hcd.usb-hid" = { status = "not-supported", test_id = "acceptance/switch-pro/sticks", evidence = [], reason = "f_hid lacks full GET_REPORT metadata and explicit negative replies; creation rejects before host resources." }
"linux.uhid.bluetooth" = { status = "wip", test_id = "acceptance/switch-pro/sticks", evidence = ["swpro-bt-full-mode-input-layout", "swpro-bt-simple-axis-neutral"], reason = "P9c source-only full-mode packed sticks and SDL simple-mode 0x8000 neutral; no host or physical acceptance." }

