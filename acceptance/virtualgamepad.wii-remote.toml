"linux.uhid.bluetooth" = { status = "source-evidence", test_id = "research:tests/test_wii_w5_diagnosis.py::WiiW5Diagnosis::test_real_runs_preserve_kernel_delivery_and_sdl_limits", evidence = ["wii-w5-kernel-motionplus-gyro-delivery", "wii-w5-motionplus-kernel-host-run", "wii-w5-motionplus-nunchuk-kernel-host-run", "wii-w7-evtest-consumer-result", "wii-w7-evtest-host-run"], reason = "Bounded Linux 6.12.113 kernel consumer observation on unchanged b23cb41: exact-owned MotionPlus evdev holder triggers acknowledged map 04/05 and all ABS_RX/RY/RZ vary with expected raw-centered slow extrema during 20 seconds, MP and MP+Nunchuk. Active emitted packet bits/vectors/slow flags and alternating pass-through verified before SDL. W7 evtest 1.35 repeats changing ABS_RX/RY/RZ with map 04 over 12 seconds on 840db277. Not calibrated physical rates, firmware cadence, radio, SDL or complete controller acceptance." }


