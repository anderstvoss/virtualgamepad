"linux.uhid.bluetooth" = { status = "source-evidence", test_id = "wii_remote::codec::activation_tests::activation_edge_matrix_preserves_pause_resend_and_alternation", evidence = ["wii-gap-wiibrew-motionplus-deactivation", "wii-w9f-dolphin-motionplus-nunchuk-on-host", "wii-w9f-dolphin-motionplus-control-host", "wii-w9g-dolphin-motionplus-nunchuk-on-result", "wii-w9g-dolphin-motionplus-nunchuk-on-host-run", "wii-w9g-dolphin-motionplus-nunchuk-reattach-off-result", "wii-w9g-dolphin-motionplus-nunchuk-reattach-off-host-run", "wii-w9g-dolphin-motionplus-nunchuk-mirror-off-result", "wii-w9g-dolphin-motionplus-nunchuk-mirror-off-host-run"], reason = "Compat creation option, default on, for Original and Plus. Activation from inactive with an already-set extension bit sends unplugged/current status, retaining AwaitingMode until 0x12. Active mode switches retain a single status regardless of the option. MP-only initial activation and deactivation unchanged. The cited pair is documented only for deactivation; W9f records the consumer boundary, not activation fidelity. Physical activation remains unmeasured. W9g exercises this option for Original mode 05 generic-bound decoded gyro and Nunchuk stick; re-attach compat is required on this bounded path; re-attach-off reproduces the reporting pause and F6-off stalls at error 7. These consumer results do not establish physical activation fidelity; draft research #65 is not cited." }
