"linux.uhid.bluetooth" = { status = "source-evidence", test_id = "research:tests/test_wii_w9g_scope.py::WiiW9gScope::test_positive_arm_keeps_transport_and_decoded_oracles_distinct", evidence = ["wii-w8-dolphin-imported-motionplus-nunchuk-result", "wii-w8-dolphin-imported-motionplus-nunchuk-host-run", "wii-w9-dolphin-motionplus-nunchuk-on-result", "wii-w9-dolphin-motionplus-nunchuk-on-host-run", "wii-w9-dolphin-motionplus-nunchuk-off-result", "wii-w9-dolphin-motionplus-nunchuk-off-host-run", "wii-w9g-dolphin-motionplus-nunchuk-on-result", "wii-w9g-dolphin-motionplus-nunchuk-on-host-run", "wii-w9g-dolphin-motionplus-nunchuk-reattach-off-result", "wii-w9g-dolphin-motionplus-nunchuk-reattach-off-host-run", "wii-w9g-dolphin-motionplus-nunchuk-mirror-off-result", "wii-w9g-dolphin-motionplus-nunchuk-mirror-off-host-run"], reason = "Bounded pass: native Dolphin 2503, Original MP+Nunchuk only, hid-wiimote not bound (test/dev host setup, #258), activation re-attach compat on and F6 mirror on, caller synthetic EEPROM/MP/Nunchuk calibration imported. The calibration copy stayed on in every arm, so its necessity is not isolated. The 180-second arm re-sends 0x12 after mode 05, reads F6 and both calibration blocks, and shows changing decoded gyro and Nunchuk stick. Raw post-map MP/child counts 4480/4479; no post-map A400F0=55. Edge-off stalls before reporting resend; F6-off errors before calibration despite raw frames. Historical bound-kernel contention remains a consumer limitation. No Plus, game, physical, button-completeness, timing or release pass." }


