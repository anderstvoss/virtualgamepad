[[functions]]
id = "retroarch-udev-generic"
[functions.cells]
"linux.uinput" = { status = "source-evidence", test_id = "research:tests/test_wii_w7_consumers.py::WiiW7Consumers::test_retroarch_controls_do_not_promote_rejected_sensor_activation", evidence = ["wii-w7-retroarch-consumer-result", "wii-w7-retroarch-host-run"], reason = "W7 RetroArch 1.20.0 Debian udev driver with original no-content diagnostic and explicit bindings: changing core buttons and Nunchuk controls over 600 frames. All accel/gyro activation requests return false; no sensor sibling retained at the two FD checkpoints. No HID parent for uinput sensor pairing. Generic controls only, no gyro or complete printed-label mapping; bounded timeout exit." }
"linux.uhid.bluetooth" = { status = "source-evidence", test_id = "research:tests/test_wii_w7_consumers.py::WiiW7Consumers::test_retroarch_controls_do_not_promote_rejected_sensor_activation", evidence = ["wii-w7-retroarch-consumer-result", "wii-w7-retroarch-host-run"], reason = "W7 RetroArch 1.20.0 Debian udev driver with original no-content diagnostic and explicit bindings: changing core buttons and Nunchuk controls over 600 frames. All accel/gyro activation requests return false; held FDs are core and Nunchuk only. Installed udev joypad has no sensor callbacks, unlike the newer surveyed RXYZ fallback; that branch is not an observed cause. Generic controls only, no gyro or physical acceptance; bounded timeout exit." }
