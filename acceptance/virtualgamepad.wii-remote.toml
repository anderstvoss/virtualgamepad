[[functions]]
id = "sdl-hidapi-wii-gyro"
[functions.cells]
"linux.uinput" = { status = "not-supported", test_id = "not_applicable", evidence = [], reason = "unavailable in this consumer realization: uinput has no Wii hidraw protocol endpoint for SDL Wii HIDAPI." }
"linux.uhid.bluetooth" = { status = "not-supported", test_id = "research:tests/test_wii_w5_diagnosis.py::WiiW5Diagnosis::test_real_runs_preserve_kernel_delivery_and_sdl_limits", evidence = ["wii-w5-sdl-linux-reset-gyro-limitation", "wii-w5-motionplus-control-host-run", "wii-w5-motionplus-nunchuk-control-host-run", "wii-w5-motionplus-holder-host-run", "wii-w5-motionplus-nunchuk-holder-host-run"], reason = "unavailable in this recorded consumer configuration: stock SDL 3.2.10/Linux 6.12.113 W5 arms produce zero gyro events. SDL resets active mapping and Linux activation does not restore/assign cached mode; holding kernel MP evdev open restores kernel mapping/delivery but does not yield SDL gyro; one holder arm disconnects. Pure Rust/emitted-packet H3 passes. Private SDL mode was not instrumented; disconnect/readback races prevent a unique cached-mode diagnosis. Bounded consumer limitation, not a model refusal or universal SDL/physical claim." }

