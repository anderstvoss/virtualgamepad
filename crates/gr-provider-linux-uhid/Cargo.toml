[package]
name = "gr-provider-linux-uhid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Linux UHID provider for virtualgamepad."

[features]
default = ["legacy-profile-api"]
legacy-profile-api = ["dep:gr-profiles", "dep:gr-runtime-model", "gr-backend-api/legacy-profile-api"]

[dependencies]
gr-controller-contract = { path = "../gr-controller-contract", version = "0.1" }
gr-backend-api = { path = "../gr-backend-api", version = "0.1", default-features = false }
gr-core = { path = "../gr-core", version = "0.1" }
gr-profiles = { path = "../gr-profiles", version = "0.1", optional = true }
gr-runtime-model = { path = "../gr-runtime-model", version = "0.1", optional = true }
libc = "0.2"
serde.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
