[package]
name = "poc-dualsense-dummy-hcd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental, root-run dummy_hcd DualSense USB gadget proof of concept."

[[bin]]
name = "poc-dualsense-dummy-hcd"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"

[lints.rust]
# The HID gadget GET_REPORT ABI is only exposed as Linux ioctls.  The small,
# contained FFI boundary is exercised by the POC's preflight and live checks.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
